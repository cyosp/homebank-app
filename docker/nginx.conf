server {
    listen 80;

    server_tokens off;
    add_header X-Content-Type-Options nosniff;

    location ~ /data/.*\.xhb {
        auth_basic              realm_name;
        auth_basic_user_file    /etc/nginx/.webdav.passwords;

        root /var/lib/homebank;
        dav_methods    PUT;
        dav_access     user:rw;

        add_header 'Access-Control-Allow-Methods' 'GET, PUT, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        if ($request_method = 'OPTIONS') {
            return 200;
        }
    }

    set $language 'en';
    if ($http_accept_language ~* '^(en|fr)') {
      set $language $1;
    }
    location / {
      alias /var/www/html/$language/;
    }

    location /en/ {
     alias /var/www/html/en/;
     try_files $uri$args /en/index.html;
    }

    location /fr/ {
      alias /var/www/html/fr/;
      try_files $uri$args /fr/index.html;
    }
}
