name: Release app and Docker image

on:
  push:
    tags:
      - '*'

jobs:

  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get tag name
        id: tag
        run: echo "NAME=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v3.5.3

      - name: Use tag name as app version and Docker tag name
        uses: jacobtomlinson/gha-find-replace@0.1.2
        with:
          include: "package.json"
          find: '"0.0.0"'
          replace: '"${{ steps.tag.outputs.NAME }}"'

      - name: Install Node 18
        uses: actions/setup-node@v2.1.4
        with:
          node-version: 18

      - name: Install Angular CLI 18
        run: sudo npm install -g @angular/cli@18.2.20

      - name: Component versions
        run: node -v && npm -v

      - name: Install dependencies
        run: npm i

      - name: Build app
        run: ng build --configuration production --localize

      - name: Remove node modules directory
        run: rm -r node_modules

      - name: Zip build app
        run: zip -r homebank-app-${{ steps.tag.outputs.NAME }}.zip *
        working-directory: dist/homebank-app

      - name: Create check sum file
        run: sha512sum *.zip > homebank-app-SHA512.txt
        working-directory: dist/homebank-app

      - name: Create GitHub release
        id: release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ steps.tag.outputs.NAME }}
          draft: true

      - name: Upload Zip to release
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: dist/homebank-app/homebank-app-${{ steps.tag.outputs.NAME }}.zip
          asset_name: homebank-app-${{ steps.tag.outputs.NAME }}.zip
          asset_content_type: application/octet-stream

      - name: Upload check sum file to release
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: dist/homebank-app/homebank-app-SHA512.txt
          asset_name: homebank-app-SHA512.txt
          asset_content_type: text/plain

      - name: Publish release with notes
        uses: cyosp/publish-release-with-notes@2.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          id: ${{ steps.release.outputs.id }}
          version: ${{ steps.tag.outputs.NAME }}
          notes: ${{ github.workspace }}/RELEASE-NOTES.md

      - name: Remove uploaded files to release
        run: rm homebank-app-${{ steps.tag.outputs.NAME }}.zip homebank-app-SHA512.txt
        working-directory: dist/homebank-app

      - name: Setup Docker QEMU
        uses: docker/setup-qemu-action@v1.2.0
        with:
          platforms: linux/amd64,linux/arm/v7,linux/arm/v8

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1.6.0

      - name: Login to DockerHub
        uses: docker/login-action@v1.12.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image to registry
        uses: docker/build-push-action@v6.18.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm/v8
          push: true
          tags: cyosp/${{ github.event.repository.name }}:${{ steps.tag.outputs.NAME }}
