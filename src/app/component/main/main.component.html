<div *ngIf="homebankFileLoaded">
  <nav class="navbar bg-light">
    <div class="container-fluid">
      <button id="hb-navbar-toggler" class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"
              (click)="isTogglerCollapsed = !isTogglerCollapsed" [attr.aria-expanded]="!isTogglerCollapsed">
        <img id="hb-navbar-brand" src="assets/homebank/hicolor_apps_256x256_homebank.png" alt="HomeBank">
      </button>

      <div id="hb-location">
        <ul class="navbar-nav">
          <li class="nav-item">
            <span class="nav-link disabled">{{ homebankTitle }}</span>
            <span class="nav-link save" (click)="save()">
              <fa-icon [icon]="saveIcon"></fa-icon>
            </span>
          </li>
        </ul>
      </div>

      <div id="hb-disconnect">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" (click)="disconnect()">
              <fa-icon [icon]="disconnectIcon"></fa-icon>
            </a>
          </li>
        </ul>
      </div>

      <!-- Leave here to ensure fixed navbar items do not move with toggler -->
      <div class="collapse navbar-collapse" id="navbarSupportedContent" [ngbCollapse]="isTogglerCollapsed">
        <ul class="navbar-nav">
          <li class="nav-item">
            <!--span class="nav-link">Categories</span-->
          </li>
        </ul>
      </div>
    </div>
  </nav>
</div>


<div id="open-file" *ngIf="!homebankFileLoaded">
  <div class="container">
    <div class="row">
      <span class="col-12 col-lg-12 open-label" i18n="@@main-open-label">Open a HomeBank file</span>
    </div>
    <div class="row">
      <span class="col-12 col-lg-12 add-top-space">
         <input type="url" class="form-control"
                [(ngModel)]="webdavUrl"
                placeholder="https://web.dav/path" i18n-placeholder="@@main-webdav-url">
      </span>
    </div>
    <div class="row">
      <span class="col-12 col-lg-6 add-top-space">
         <input type="text" class="form-control"
                [(ngModel)]="webdavLogin" placeholder="Login"
                i18n-placeholder="@@main-webdav-login">
      </span>
      <span class="col-12 col-lg-6 add-top-space">
         <input type="password" class="form-control"
                [(ngModel)]="webdavPassword"
                placeholder="Password" i18n-placeholder="@@main-webdav-password">
      </span>
    </div>
    <div class="row">
      <span class="col-12 col-lg-12 add-top-space">
         <button id="open-webdav-file-button" class="form-control" (click)="webdavLoad()"
                 i18n="@@main-webdav-load">Via WebDav</button>
      </span>
    </div>
    <div class="row">
      <span class="col-12 col-lg-12 or" i18n="@@main-open-or">Or</span>
    </div>
    <div class="row">
      <span class="col-12 col-lg-12">
        <input id="open-local-file-input" type="file" accept=".xhb" (change)="homebankFileChanged($event)" #file>
        <button id="open-local-file-button" class="btn form-control" (click)="file.click()"
                i18n="@@main-open-local-file">Using local file</button>
      </span>
    </div>
  </div>
</div>

<router-outlet></router-outlet>
